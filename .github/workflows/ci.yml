name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true  # legacy lint debt — warn for now, don't block merges

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret-not-used-at-build-time
          AUTH_USERNAME: ci
          AUTH_PASSWORD: ci
          DATABASE_URL: "file:./ci.db"
